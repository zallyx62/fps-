<!doctype html><html><head><meta charset=utf8><style>html,body{margin:0;height:100%;background:#000}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id=c></canvas>
<script src="engine.js"></script>
<script>
const {m4,Geo,hex,WIND,GRID1,GRID2}=E; const R=E.init(document.getElementById('c'));
const q=new URLSearchParams(location.search).get('q')||'eleve'; R.setQuality(E.QUALITY[q]);
const g=new Geo(), m=m4.create();
g.box(m4.trs(m,0,-.5,0),80,1,80,hex(0x5a6068),[.55,0,0,GRID2]);
g.box(m4.trs(m,-4,1.3,-3),2.4,2.6,6,hex(0xb5452f),[.6,.3,0,GRID1],{ao:[.5,1]});
g.box(m4.trs(m,3,1,-6),4,2,4,hex(0x2f7f86),[.5,.2,0,GRID1],{ao:[.5,1]});
g.rbox(m4.trs(m,0,.6,0),1.2,1.2,1.2,.15,hex(0xd9a441),[.35,0,0,0]);
g.cyl(m4.trs(m,5,0,2),.5,.5,4,16,hex(0x555b60),[.4,.8,0,0]);
g.sphere(m4.trs(m,5,4.4,2),.5,16,10,hex(0xfff0c0),[.5,0,1,0]);
g.sphere(m4.trs(m,-2,1,3),1,24,16,hex(0xcccccc),[.15,1,0,0]);
g.ico(m4.trs(m,2.5,.7,3.5),1,1,hex(0x7a7f85),[.9,0,0,0],{jit:.18,sy:.7});
g.wedge(m4.trs(m,-8,0,4),3,1.5,5,hex(0x777c82),[.7,0,0,0]);
E.geoText(g,m4.trs(m,0,5,-9),'RIXE 9',.22,.2,hex(0xff3b6b),[.4,0,1,0]);
for(let i=0;i<5;i++){ g.cyl(m4.trs(m,-10+i*1.5,0,-8),.12,.09,1.6,6,hex(0x6b4a2f),[.9,0,0,0]); g.ico(m4.trs(m,-10+i*1.5,2.3,-8),1,1,hex(0x3f9e4d),[.8,0,0,WIND(.8)],{jit:.2,seed:i+3}); }
const mesh=R.mesh(g);
const b=R.batch(R.unit.rbox,16); const I=m4.create();
const ps=new E.Particles();
R.env.sunDir=(()=>{const v=[.55,.42,.35],l=Math.hypot(...v);return v.map(x=>x/l)})();
R.env.fogDen=.0035; R.env.sunDir=(()=>{const v=[-.25,.2,-.9],l=Math.hypot(...v);return v.map(x=>x/l)})(); R.env.sunCol=[4.2,2.9,1.7]; R.env.hor=[.95,.55,.3]; R.env.zen=[.1,.2,.5]; R.env.glow=[1.6,.8,.3]; R.env.cloudCol=[1.5,1.0,.8]; R.env.cloud=.42;
const hm=new Float32Array(64*64).fill(-3); R.water=null;
let t=0; window.frames_=0;
function loop(){ t+=1/60; R.resize(); R.cam.pos=[Math.sin(t*.2)*3+1,3.2,10]; R.cam.h=-.1+Math.sin(t*.2)*.1; R.cam.p=-.18;
  R.begin(t); R.draw(mesh,I,{}); b.reset(); for(let i=0;i<6;i++){ m4.trs(m,-3+i*1.2,.5+Math.abs(Math.sin(t*2+i))*1,5,t+i,0,0,.5,.9,.4); b.add(m,.2+i*.15,.6,1-i*.15,.5,0,i==2?1:0); } R.drawBatch(b);
  R.light(5,4.2,2,6,5,3,9);
  if(Math.random()<.5) ps.spawn(0,1.4,0,(Math.random()-.5)*2,3,(Math.random()-.5)*2,1.2,.1,.5,4,2,.6,1,1,0,3,.5);
  ps.update(1/60); ps.draw(R); R.beam(-6,1.5,6,6,2,-6,.05,6,2,1,1);
  R.end(); window.frames_++; requestAnimationFrame(loop); }
loop();
</script></body></html>
