name: Validate RIXE repository
on:
  push:
    branches: [main, jeu-unreal]
  pull_request:
    branches: [main, jeu-unreal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-tools:
    name: Static checks and asset-generator smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - name: Validate specification aggregate
        run: python Tools/split_spec.py check
      - name: Install tool dependencies
        run: python -m pip install --requirement Tools/requirements.txt
      - name: Validate project and generated assets
        run: python Tools/validate_project.py
