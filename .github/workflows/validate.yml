name: Validate RIXE repository
on:
  push:
    branches: [main, jeu-unreal]
  pull_request:
    branches: [main, jeu-unreal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-tools:
    name: Static checks and asset-generator smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - name: Install tool dependencies
        run: python -m pip install --requirement Tools/requirements.txt
      - name: Validate project and generated assets
        run: python Tools/validate_project.py
