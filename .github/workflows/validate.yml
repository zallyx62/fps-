name: Validate RIXE repository
on:
  push:
    branches: [main, jeu-unreal]
  pull_request:
    branches: [main, jeu-unreal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-tools:
    name: Static checks and weapon generator smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - name: Install tool dependencies
        run: python -m pip install --requirement Tools/requirements.txt
      - name: Validate project and generated weapon geometry
        run: python Tools/validate_project.py
